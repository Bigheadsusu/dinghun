<style>
/* ================= 全局 · 宣纸墨韵 ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
:root {
    --paper: #f5efe2;
    --ink: #33302b;
    --ink-soft: rgba(51, 48, 43, 0.62);
    --ink-faint: rgba(51, 48, 43, 0.35);
    --cinnabar: #b13328;
    --cinnabar-soft: rgba(177, 51, 40, 0.42);
}
body {
    font-family: "SimSun", "Songti SC", "宋体", serif;
    color: var(--ink);
    line-height: 1.8;
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(1100px 560px at 88% -8%, rgba(177, 51, 40, 0.055), transparent 62%),
        radial-gradient(900px 520px at -12% 34%, rgba(51, 48, 43, 0.05), transparent 60%),
        radial-gradient(760px 420px at 78% 88%, rgba(51, 48, 43, 0.04), transparent 58%),
        var(--paper);
}
.kai { font-family: "KaiTi", "STKaiti", "楷体", "Microsoft JhengHei", serif; }
.wrap { max-width: 600px; margin: 0 auto; padding: 34px 30px 0; position: relative; }

/* ================= 音乐按钮（纯 SVG 图标） ================= */
.music-btn {
    position: fixed; top: 16px; right: 16px; z-index: 999;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(245, 239, 226, 0.88);
    border: 1px solid var(--cinnabar-soft);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--cinnabar);
    box-shadow: 0 2px 10px rgba(51, 48, 43, 0.12);
}
.music-btn svg { width: 20px; height: 20px; display: block; }
.music-btn svg.spin { animation: spin 4s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ================= 封面 · 大留白 ================= */
.hero { text-align: center; padding: 58px 0 8px; position: relative; }
.hero .eyebrow {
    font-size: 12px; letter-spacing: 13px; text-indent: 13px;
    color: var(--cinnabar); margin-bottom: 34px;
}
.hero .wuxi {
    font-size: clamp(38px, 11vw, 50px); font-weight: 700;
    letter-spacing: 18px; text-indent: 18px; color: var(--ink);
    line-height: 1.3;
}
.hero .names {
    font-size: clamp(30px, 9vw, 40px); color: var(--ink);
    letter-spacing: 4px; margin-top: 26px; line-height: 1.4;
}
.hero .names .dot {
    font-style: normal; font-size: 13px; color: var(--cinnabar);
    margin: 0 16px; vertical-align: middle; opacity: 0.85;
}
/* 印章 */
.seal {
    position: relative; width: 54px; height: 54px; margin: 36px auto 0;
    background: var(--cinnabar); color: #f9f4e6; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; transform: rotate(-3deg);
    box-shadow: 0 2px 8px rgba(140, 35, 25, 0.28);
}
.seal::after {
    content: ""; position: absolute; inset: 3px;
    border: 1px solid rgba(249, 244, 230, 0.55); border-radius: 4px;
}
/* 竖排联句 · 虚实相生 */
.couplet {
    display: flex; flex-direction: row-reverse;
    justify-content: center; gap: 58px;
    height: 208px; margin: 46px auto 0;
}
.couplet .line {
    writing-mode: vertical-rl; letter-spacing: 11px;
    font-size: 17px; color: var(--ink);
}
.couplet .line.b { margin-top: 40px; color: var(--ink-soft); }
.hero .invite {
    font-size: 14px; letter-spacing: 6px; text-indent: 6px;
    color: var(--ink-soft); margin-top: 44px;
}
.hero .date { margin-top: 30px; }
.hero .date .num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 29px; letter-spacing: 2px; color: var(--ink);
}
.hero .date .num em { font-style: normal; color: var(--cinnabar); margin: 0 7px; }
.hero .date .lunar {
    display: block; font-size: 13px; letter-spacing: 7px; text-indent: 7px;
    color: var(--ink-soft); margin-top: 10px;
}

/* ================= 分节 · 一点朱砂 ================= */
.orna { display: flex; align-items: center; gap: 16px; margin: 68px 0 4px; }
.orna .l, .orna .r { flex: 1; height: 1px; }
.orna .l { background: linear-gradient(90deg, transparent, var(--ink-faint)); }
.orna .r { background: linear-gradient(90deg, var(--ink-faint), transparent); }
.orna .d { color: var(--cinnabar); font-size: 11px; line-height: 1; }

/* ================= 婚宴信息 · 疏密对比 ================= */
.info { position: relative; padding: 30px 4px 0; }
.info .watermark {
    position: absolute; top: 26px; right: -14px;
    font-size: 200px; line-height: 1; color: rgba(177, 51, 40, 0.045);
    pointer-events: none; user-select: none;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
}
.block { display: flex; gap: 24px; align-items: flex-start; margin: 48px 0; position: relative; }
.block .v-label {
    writing-mode: vertical-rl; letter-spacing: 15px; text-indent: 3px;
    font-size: 13px; color: var(--cinnabar);
    border: 1px solid var(--cinnabar-soft); border-radius: 3px;
    padding: 13px 7px; background: rgba(177, 51, 40, 0.04);
    flex-shrink: 0;
}
.block .content { flex: 1; padding-top: 2px; }
.block h3 { font-size: 24px; font-weight: 600; letter-spacing: 3px; color: var(--ink); line-height: 1.6; }
.block .sub {
    font-size: 14px; color: var(--ink-soft);
    letter-spacing: 2px; line-height: 2.1; margin-top: 8px;
}
.nav {
    display: inline-block; margin-top: 16px;
    color: var(--cinnabar); text-decoration: none;
    font-size: 13px; letter-spacing: 5px; text-indent: 5px;
    border-bottom: 1px solid var(--cinnabar-soft); padding-bottom: 4px;
}
.nav:active { opacity: 0.7; }

/* 落款 · 呼应印章 */
.sign {
    margin-top: 58px; text-align: right;
    display: flex; justify-content: flex-end; align-items: center; gap: 16px;
}
.sign .names { font-size: 20px; letter-spacing: 5px; color: var(--ink); }
.sign .seal-mini {
    position: relative; width: 40px; height: 40px; flex-shrink: 0;
    background: var(--cinnabar); color: #f9f4e6; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(3deg);
    box-shadow: 0 1px 6px rgba(140, 35, 25, 0.25);
}
.sign .seal-mini::after {
    content: ""; position: absolute; inset: 2px;
    border: 1px solid rgba(249, 244, 230, 0.5); border-radius: 3px;
}
.sign .seal-mini span {
    writing-mode: vertical-rl; font-size: 13px; letter-spacing: 3px; line-height: 1;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
}

/* ================= 尾景 · 远山淡墨 ================= */
footer { margin-top: 74px; text-align: center; position: relative; }
footer .sun {
    width: 42px; height: 42px; border-radius: 50%; margin: 0 auto;
    background: radial-gradient(circle, rgba(177, 51, 40, 0.66), rgba(177, 51, 40, 0.38));
    filter: blur(0.4px);
}
footer .mountains { display: block; width: 100%; height: 110px; margin-top: -14px; }
footer .blessing {
    padding: 4px 0 52px; font-size: 12.5px; color: var(--ink-soft);
    letter-spacing: 4px; text-indent: 4px; line-height: 2.5;
}

/* ================= 移动端微调 ================= */
@media (max-width: 420px) {
    .wrap { padding: 24px 22px 0; }
    .couplet { gap: 42px; height: 188px; }
    .couplet .line { font-size: 16px; letter-spacing: 9px; }
    .couplet .line.b { margin-top: 32px; }
    .info .watermark { font-size: 150px; right: -18px; }
    .block { gap: 18px; margin: 40px 0; }
}
</style>
</head>
<body>

<!-- 音乐按钮 -->
<div class="music-btn" id="musicToggle" role="button" aria-label="播放或暂停背景音乐" title="播放 / 暂停音乐">
    <svg id="musicIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 17.6V6.1l10-2v11.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <circle cx="6.6" cy="17.6" r="2.6" fill="currentColor"/>
        <circle cx="16.6" cy="15.5" r="2.6" fill="currentColor"/>
    </svg>
</div>
<audio id="bgm" loop preload="auto" src="assets/audio/bgm.mp3"></audio>

<div class="wrap">

    <!-- ======== 封面 · 吾家有喜 ======== -->
    <section class="hero">
        <p class="eyebrow">结 婚 喜 宴</p>
        <h1 class="wuxi kai">吾家有喜</h1>
        <div class="names kai">魏永森<i class="dot">◆</i>叶湄敏</div>
        <div class="seal kai">囍</div>
        <div class="couplet kai">
            <span class="line a">有生之年 · 欣喜相逢</span>
            <span class="line b">佳期已定 · 敬备喜筵</span>
        </div>
        <p class="invite">诚挚邀请您参加我们的婚礼喜宴</p>
        <div class="date">
            <span class="num">2026<em>·</em>10<em>·</em>01</span>
            <span class="lunar">农历八月廿一 · 星期四 · 中午十二时</span>
        </div>
    </section>

    <div class="orna" aria-hidden="true"><span class="l"></span><span class="d">◆</span><span class="r"></span></div>

    <!-- ======== 婚宴信息 · 疏密有致 ======== -->
    <section class="info">
        <div class="watermark" aria-hidden="true">囍</div>

        <div class="block">
            <span class="v-label kai">时&nbsp;间</span>
            <div class="content">
                <h3 class="kai">二〇二六年十月一日</h3>
                <p class="sub">星期四 · 农历八月廿一<br>中午 12:00 · 敬备午宴</p>
            </div>
        </div>

        <div class="block">
            <span class="v-label kai">地&nbsp;点</span>
            <div class="content">
                <h3 class="kai">永泰县长庆镇</h3>
                <p class="sub">人民政府东 50 米 · 永泰县</p>
                <a class="nav" target="_blank" rel="noopener" href="https://uri.amap.com/search?keyword=永泰县长庆镇人民政府">位 置 导 航</a>
            </div>
        </div>

        <div class="sign">
            <span class="names kai">魏永森 · 叶湄敏&nbsp;敬邀</span>
            <span class="seal-mini"><span>敬邀</span></span>
        </div>
    </section>

    <!-- ======== 尾景 · 远山 ======== -->
    <footer>
        <div class="sun" aria-hidden="true"></div>
        <svg class="mountains" viewBox="0 0 800 140" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,140 L0,88 Q110,26 230,84 T460,66 T800,98 L800,140 Z" fill="rgba(51,48,43,0.055)"/>
            <path d="M0,140 L0,112 Q190,58 390,106 T800,124 L800,140 Z" fill="rgba(51,48,43,0.085)"/>
        </svg>
        <p class="blessing">期待您的光临 · 共证良缘<br>愿与您共赴这场红妆之约</p>
    </footer>
</div>

<script>
(function () {
    // ---------- 背景音乐 ----------
    var audio = document.getElementById('bgm');
    var icon = document.getElementById('musicIcon');
    var toggle = document.getElementById('musicToggle');
    var playing = false;

    function setState(state) {
        playing = state;
        if (icon) { icon.classList.toggle('spin', playing); }
        toggle.setAttribute('aria-pressed', playing ? 'true' : 'false');
    }
    function playBgm() {
        if (!audio) return;
        var p = audio.play();
        if (p && p.then) { p.then(function () { setState(true); }); }
        else { setState(true); }
    }
    function pauseBgm() {
        if (!audio) return;
        audio.pause();
        setState(false);
    }
    toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        if (playing) { pauseBgm(); } else { playBgm(); }
    });
    // 尝试自动播放；被拦截时等待首次触摸/点击
    document.addEventListener('DOMContentLoaded', function () {
        if (!audio) return;
        var p = audio.play();
        if (p && p.catch) {
            p.catch(function () {
                var once = function () {
                    audio.play();
                    document.removeEventListener('touchstart', once);
                    document.removeEventListener('click', once);
                };
                document.addEventListener('touchstart', once, { passive: true });
                document.addEventListener('click', once, { once: true });
            });
        }
    });
})();
</script>
