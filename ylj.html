<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 微信/QQ 分享优化 Meta -->
    <meta property="og:title" content="结婚喜宴">
    <meta property="og:description" content="吾家有喜 · 有生之年欣喜相逢，佳期已定敬备喜筵，诚挚邀请您参加我们的婚礼喜宴。">
    <meta property="og:image" content="https://bigheadsusu.github.io/dinghun/assets/img/og-ylj.png">
    <meta property="og:url" content="https://bigheadsusu.github.io/dinghun/ylj.html">
    <meta property="og:type" content="website">
    <meta name="description" content="魏永森 与 叶湄敏 结婚喜宴邀请函 · 吾家有喜，佳期已定，敬备喜筵，诚邀您共赴婚礼喜宴。">
    <meta name="theme-color" content="#c8102e" />
    <!-- 唯一应用图片：og-ylj.png（同时用作 favicon 与分享图，移除其余多余图片引用） -->
    <link rel="icon" href="https://bigheadsusu.github.io/dinghun/assets/img/og-ylj.png" type="image/png" />
    <meta itemprop="name" content="结婚喜宴">
    <meta itemprop="description" content="吾家有喜 · 有生之年欣喜相逢，佳期已定敬备喜筵，诚挚邀请您参加我们的婚礼喜宴。">
    <meta itemprop="image" content="https://bigheadsusu.github.io/dinghun/assets/img/og-ylj.png">
    <title>结婚喜宴</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 中国风字体 ===== */
        body {
            /* 纯红背景 · 扁平化 */
            background: #c8102e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Songti SC', 'SimSun', '宋体', 'Noto Serif SC', 'STSong', serif;
            padding: 14px;
            position: relative;
            overflow-x: hidden;
        }
        /* 视口金线装饰框（扁平） */
        body::before {
            content: "";
            position: fixed;
            inset: 10px;
            border: 2px solid rgba(230, 180, 34, 0.55);
            border-radius: 6px;
            pointer-events: none;
            z-index: 1;
        }

        /* ===== 全局飘落特效容器 ===== */
        #global-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .falling-item {
            position: absolute;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
        }

        /* ===== 邀请函主卡片（扁平 · 金边双线） ===== */
        .invitation {
            max-width: 480px;
            width: 100%;
            background: #b11a1a;
            border-radius: 18px;
            border: 3px solid #e6b422;
            padding: 28px 22px 32px;
            position: relative;
            z-index: 10;
        }
        /* 内层细金线框 */
        .invitation::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid #e6b422;
            border-radius: 12px;
            pointer-events: none;
            z-index: 0;
        }
        /* 「囍」水印 */
        .invitation::after {
            content: "囍";
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            font-size: 300px;
            line-height: 1;
            color: rgba(200, 16, 46, 0.06);
            z-index: 0;
            pointer-events: none;
        }
        .invitation > * {
            position: relative;
            z-index: 1;
        }

        .top-ornament {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            color: #f4d03f;
        }
        .top-ornament i {
            font-size: 20px;
            opacity: 0.7;
            animation: pulse 2s infinite;
        }
        .top-ornament span {
            font-size: 16px;
            letter-spacing: 8px;
            font-weight: 300;
            color: #f4d03f;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        .title-main {
            text-align: center;
            margin-bottom: 12px;
        }
        .title-main h2 {
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            font-size: 32px;
            font-weight: 700;
            color: #f4d03f;
            letter-spacing: 12px;
            margin-bottom: 4px;
        }
        .title-main .en-sub {
            font-size: 12px;
            letter-spacing: 4px;
            color: #b8860b;
            text-transform: uppercase;
            border-top: 1px solid #e6b422;
            display: inline-block;
            padding-top: 6px;
        }

        /* 唯一应用图片（金边相框 · 扁平） */
        .hero-photo {
            width: 78%;
            max-width: 320px;
            aspect-ratio: 16 / 9;
            margin: 6px auto 16px;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #e6b422;
            background: #b11a1a;
        }
        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .couple-names {
            text-align: center;
            margin: 18px 0 16px;
        }
        .groom, .bride {
            display: inline-block;
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            font-size: 44px;
            font-weight: 700;
            color: #fff3d6;
            line-height: 1.2;
        }
        /* 新人角色标签 + 红色圆点强调（新郎 / 新娘） */
        .person {
            display: inline-block;
            vertical-align: middle;
        }
        .person .role {
            display: block;
            font-size: 14px;
            letter-spacing: 4px;
            color: #f3d9b0;
            font-weight: 600;
            margin-bottom: 6px;
        }
        /* 红色圆点：主题色 / 状态标识 */
        .red-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #e63329;
            margin-right: 5px;
            vertical-align: middle;
        }
        /* 主题标识状态条 */
        .theme-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: transparent;
            border: 1px solid #f4d03f;
            color: #f4d03f;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 700;
            margin: 0 auto 14px;
        }
        .and-sign {
            display: inline-block;
            font-size: 32px;
            margin: 0 10px;
            color: #b8860b;
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            vertical-align: middle;
        }

        /* 新人敬邀文案（扁平红底金边） */
        .announcement {
            text-align: center;
            margin: 8px 0 20px;
            padding: 22px 16px;
            border-radius: 14px;
            background: #b11a1a;
            border: 2px solid #e6b422;
            color: #fbf3e4;
        }
        .announcement .xi-block {
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            font-size: 34px;
            font-weight: 800;
            color: #f4d03f;
            letter-spacing: 12px;
            margin-bottom: 12px;
        }
        .announcement .poem {
            font-size: 17px;
            letter-spacing: 3px;
            color: #fbf3e4;
            line-height: 2;
        }
        .announcement .main-invite {
            font-size: 19px;
            font-weight: 700;
            color: #f4d03f;
            margin: 14px 0 8px;
            letter-spacing: 2px;
        }
        /* 姓名仅保留一处（主区 couple-names），此处不再重复展示 */
        .announcement .sub-note {
            font-size: 14px;
            color: #f3d9b0;
            opacity: 0.92;
            margin-top: 8px;
            letter-spacing: 2px;
        }

        /* 日期卡（扁平红底金边） */
        .date-card {
            background: #b11a1a;
            border-radius: 14px;
            padding: 16px 18px;
            margin: 20px 0 16px;
            border: 2px solid #e6b422;
            border-left: 6px solid #e6b422;
        }
        .date-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .gregorian {
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            font-size: 28px;
            font-weight: 700;
            color: #f4d03f;
        }
        .lunar {
            font-size: 18px;
            color: #b11a1a;
            background: #f4d03f;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 600;
        }
        .time-info {
            font-size: 20px;
            margin-top: 12px;
            font-weight: 500;
            color: #fbf3e4;
        }

        /* 地点信息（扁平红底金边） */
        .location-section {
            background: #b11a1a;
            border-radius: 14px;
            padding: 16px 18px;
            margin: 18px 0 20px;
            text-align: center;
            border: 2px solid #e6b422;
        }
        .venue-name {
            font-size: 22px;
            font-weight: 700;
            color: #f4d03f;
            letter-spacing: 2px;
        }
        .address-detail {
            font-size: 16px;
            margin: 8px 0 16px;
            color: #fbf3e4;
            word-break: break-word;
        }
        .nav-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #e6b422;
            color: #8c1414;
            padding: 16px 30px;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border: 2px solid #fbf3e4;
            width: fit-content;
            margin: 0 auto;
            gap: 10px;
            letter-spacing: 4px;
        }
        .nav-btn:active {
            transform: translateY(2px);
        }

        /* ===== 刮刮乐彩票游戏区（扁平红底金边） ===== */
        .scratch-section {
            background: #b11a1a;
            border-radius: 16px;
            padding: 20px 16px 22px;
            margin: 24px 0 16px;
            border: 2px solid #e6b422;
            text-align: center;
        }
        .scratch-title {
            font-size: 22px;
            color: #f4d03f;
            letter-spacing: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }
        .scratch-title i {
            color: #f4d03f;
            font-size: 24px;
        }

        .scratch-card {
            background: #b11a1a;
            border-radius: 14px;
            padding: 8px;
            margin-bottom: 18px;
            border: 2px solid #e6b422;
        }
        .scratch-card.shake {
            animation: cardShake 0.4s ease-in-out;
        }
        @keyframes cardShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }

        .card-inner {
            position: relative;
            background: #a01717;
            border-radius: 10px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #e6b422;
        }

        .blessing-text {
            font-family: 'KaiTi', 'STKaiti', '楷体', serif;
            font-size: 26px;
            font-weight: 800;
            color: #f4d03f;
            padding: 20px 12px;
            text-align: center;
            line-height: 1.4;
            word-break: break-word;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 4px;
            position: relative;
            z-index: 2;
        }
        .blessing-text.pop {
            transform: scale(1.2);
        }

        /* 刮刮涂层 */
        .scratch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #b0a090;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #faf0e0;
            font-size: 26px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #5e4d3d;
            border: 2px solid #8a7a6a;
            cursor: pointer;
            letter-spacing: 6px;
            overflow: hidden;
            z-index: 10;
            pointer-events: auto;
        }
        .scratch-layer::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            height: 100%;
            background: rgba(255, 255, 255, 0.28);
            transform: skewX(-20deg);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            20% { left: 120%; }
            100% { left: 120%; }
        }
        .scratch-layer span {
            font-size: 16px;
            margin-top: 8px;
            letter-spacing: 4px;
            background: rgba(90, 60, 40, 0.3);
            padding: 4px 16px;
            border-radius: 30px;
            position: relative;
            z-index: 2;
        }
        .scratch-layer.hidden-layer {
            display: none;
        }

        .new-scratch-btn {
            background: #e6b422;
            border: 2px solid #fbf3e4;
            color: #8c1414;
            font-size: 22px;
            padding: 14px 16px;
            border-radius: 50px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 6px;
        }
        .new-scratch-btn:active {
            transform: translateY(2px);
        }
        .scratch-footer {
            margin-top: 8px;
            color: #f3d9b0;
            font-size: 14px;
        }

        /* 音乐控制 */
        .music-widget {
            display: flex;
            justify-content: center;
            margin: 16px 0 4px;
        }
        .music-toggle {
            background: #b11a1a;
            border: 2px solid #e6b422;
            border-radius: 50px;
            padding: 8px 20px;
            color: #fbf3e4;
            font-size: 18px;
            cursor: pointer;
        }
        .music-toggle:active {
            transform: translateY(2px);
        }

        .touch-hint {
            font-size: 13px;
            color: #b8860b;
            margin-top: 6px;
            text-align: center;
        }

        /* （已移除未使用的落款样式：页面无对应 HTML 元素） */

        /* 特效容器 */
        .floating-heart {
            position: absolute;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
        }

        @media (max-width: 400px) {
            .invitation { padding: 20px 14px 24px; }
            .groom, .bride { font-size: 34px; }
            .person .role { font-size: 12px; letter-spacing: 2px; }
            .theme-badge { font-size: 12px; letter-spacing: 2px; }
            .gregorian { font-size: 24px; }
            .blessing-text { font-size: 22px; }
            .announcement .xi-block { font-size: 28px; letter-spacing: 8px; }
        }
    </style>
</head>
<body>
    <!-- 全局飘落特效层 -->
    <div id="global-effects"></div>

    <div class="invitation">
        <div class="top-ornament">
            <i class="fas fa-pepper"></i>
            <span>· 良 辰 ·</span>
            <i class="fas fa-leaf"></i>
        </div>

        <!-- 主题标识：红色圆点 + 结婚喜宴（状态 / 主题色标识） -->
        <div class="theme-badge"><i class="red-dot"></i> 结婚喜宴</div>

        <div class="title-main">
            <h2>结婚喜宴</h2>
            <div class="en-sub">WEDDING BANQUET</div>
        </div>

        <!-- 唯一应用图片（金边相框） -->
        <div class="hero-photo">
            <img src="https://bigheadsusu.github.io/dinghun/assets/img/og-ylj.png" alt="结婚喜宴 · 魏永森 与 叶湄敏">
        </div>

        <div class="couple-names">
            <div class="person">
                <span class="role"><i class="red-dot"></i>新郎</span>
                <span class="groom">魏永森</span>
            </div>
            <span class="and-sign">&</span>
            <div class="person">
                <span class="role"><i class="red-dot"></i>新娘</span>
                <span class="bride">叶湄敏</span>
            </div>
        </div>

        <!-- 吾家有喜 · 敬邀文案 -->
        <div class="announcement">
            <div class="xi-block">吾家有喜</div>
            <div class="poem">有生之年 · 欣喜相逢</div>
            <div class="poem">佳期已定 · 敬备喜筵</div>
            <div class="main-invite">诚挚邀请您参加我们的婚礼喜宴</div>
            <div class="sub-note">敬备喜酌 · 恭候光临</div>
        </div>

        <div class="date-card">
            <div class="date-row">
                <span class="gregorian">10月1日</span>
                <span class="lunar">农历八月廿一</span>
            </div>
            <div class="time-info">
                <i class="far fa-clock"></i> <i class="red-dot"></i> 星期四 · 12:00 午宴
            </div>
        </div>

        <div class="location-section">
            <div class="venue-name">婚礼地点</div>
            <div class="address-detail">
                <i class="fas fa-map-pin"></i> 永泰县长庆镇人民政府东50米 永泰县
            </div>
            <a href="https://surl.amap.com/1JpbYke1sgfZ" class="nav-btn" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-map-signs"></i> 一键导航
            </a>
            <div style="font-size:13px; margin-top:10px; color:#f3d9b0;">
                <i class="fas fa-car"></i> 点击唤醒高德地图
            </div>
        </div>

        <!-- 刮刮乐互动区 -->
        <div class="scratch-section">

                <i class="fas fa-ticket-alt"></i> 喜相逢·幸运刮刮乐 <i class="fas fa-gift"></i>

            <div class="scratch-card" id="scratchCard">
                <div class="card-inner" id="cardInner">
                    <div id="blessingText" class="blessing-text">🎫 感谢赴宴</div>

                        刮开有喜<br><span>点击刮奖</span>

        <div class="music-widget">

            </button>
        </div>
        <div class="touch-hint" id="hintText">
            <i class="far fa-hand-pointer"></i> 轻触页面任意处播放喜乐
        </div>

        <audio id="bgMusic" loop preload="auto" src="https://bigheadsusu.github.io/dinghun/assets/audio/bgm.mp3"></audio>
    </div>

    <script>
        (function() {
            // ---------- 全局飘落特效 ----------
            function createFallingItem() {
                const container = document.getElementById('global-effects');
                const symbols = ['🌸', '✨', '🧧', '❤️', '🎉', '🍃', '🌟', '🪷'];
                const item = document.createElement('div');
                item.className = 'falling-item';
                item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                item.style.left = Math.random() * 100 + '%';
                item.style.fontSize = (14 + Math.floor(Math.random() * 24)) + 'px';
                item.style.animationDuration = (6 + Math.random() * 8) + 's';
                item.style.animationDelay = Math.random() * 5 + 's';
                item.style.opacity = 0.4 + Math.random() * 0.4;
                container.appendChild(item);

                setTimeout(() => {
                    if (item.parentNode) item.remove();
                }, 15000);
            }

            for (let i = 0; i < 20; i++) {
                setTimeout(() => createFallingItem(), i * 200);
            }
            setInterval(createFallingItem, 2000);

            // ---------- 背景音乐 ----------
            const bgMusic = document.getElementById('bgMusic');
            const musicToggleBtn = document.getElementById('musicToggleBtn');
            const musicTextSpan = document.getElementById('musicText');
            const musicIconSpan = document.getElementById('musicIcon');
            const hintText = document.getElementById('hintText');

            let userHasInteracted = false;

            bgMusic.load();
            bgMusic.volume = 0.65;

            function updateMusicButton() {
                const playing = !bgMusic.paused;
                musicTextSpan.textContent = playing ? '暂停音乐' : '播放音乐';
                musicIconSpan.className = playing ? 'fas fa-volume-up' : 'fas fa-music';
            }

            function attemptPlayMusic() {
                if (bgMusic.paused) {
                    const playPromise = bgMusic.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            updateMusicButton();
                            if (hintText) hintText.style.opacity = '0.6';
                        }).catch(err => {});
                    }
                } else {
                    updateMusicButton();
                }
            }

            function pauseMusic() {
                bgMusic.pause();
                updateMusicButton();
            }

            function toggleMusic() {
                if (bgMusic.paused) {
                    attemptPlayMusic();
                } else {
                    pauseMusic();
                }
            }

            function handleFirstTouchPlay(e) {
                if (bgMusic.paused) {
                    attemptPlayMusic();
                }
                userHasInteracted = true;
                document.removeEventListener('touchstart', handleFirstTouchPlay);
                document.removeEventListener('click', handleFirstTouchPlay);
                if (hintText) {
                    hintText.innerHTML = '<i class="fas fa-check-circle"></i> 喜乐相伴，刮出谢意';
                }
            }

            document.addEventListener('touchstart', handleFirstTouchPlay, { passive: true });
            document.addEventListener('click', handleFirstTouchPlay);

            musicToggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMusic();
                if (!userHasInteracted) {
                    handleFirstTouchPlay(e);
                }
            });

            bgMusic.addEventListener('play', updateMusicButton);
            bgMusic.addEventListener('pause', updateMusicButton);
            bgMusic.addEventListener('error', () => {
                musicTextSpan.innerText = '音乐加载失败';
            });

            // ---------- 刮刮乐逻辑 ----------
            const blessingText = document.getElementById('blessingText');
            const scratchLayer = document.getElementById('scratchLayer');
            const newScratchBtn = document.getElementById('newScratchBtn');
            const scratchCard = document.getElementById('scratchCard');
            const cardInner = document.getElementById('cardInner');

            const thankYouMessages = [
                "🌸 承蒙厚爱 · 莅临见证",
                "🎉 拨冗赴宴 · 喜气同沾",
                "💖 高朋满座 · 蓬荜生辉",
                "🥂 感谢光临 · 情意深重",
                "✨ 劳步远至 · 铭感五内",
                "🏮 亲友齐聚 · 喜上添喜",
                "🍊 盛情赴约 · 福泽绵长",
                "🌟 贵宾盈门 · 良缘增辉",
                "🪷 如约而至 · 温暖相随",
                "🎋 幸甚至哉 · 谢君莅临"
            ];

            function getRandomThanks() {
                return thankYouMessages[Math.floor(Math.random() * thankYouMessages.length)];
            }

            function spawnFloatingHearts(clientX, clientY) {
                const rect = cardInner.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const symbols = ['❤️', '🧧', '✨', '🎉', '🌸', '🍀'];
                const count = 10;

                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    heart.style.left = (centerX + (Math.random() - 0.5) * 120) + 'px';
                    heart.style.top = (centerY + (Math.random() - 0.5) * 100) + 'px';
                    heart.style.fontSize = (16 + Math.floor(Math.random() * 20)) + 'px';
                    heart.style.animation = `floatUp ${0.8 + Math.random() * 0.6}s ease-out forwards`;
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        if (heart.parentNode) heart.remove();
                    }, 1500);
                }
            }

            function scratchCardAction(e) {
                if (!scratchLayer.classList.contains('hidden-layer')) {
                    scratchLayer.classList.add('hidden-layer');

                    blessingText.classList.add('pop');
                    setTimeout(() => blessingText.classList.remove('pop'), 300);

                    if (navigator.vibrate) navigator.vibrate(20);

                    let clientX, clientY;
                    if (e && e.touches) {
                        clientX = e.touches[0].clientX;
                        clientY = e.touches[0].clientY;
                    } else if (e) {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }
                    spawnFloatingHearts(clientX, clientY);
                }
            }

            function resetScratchCard() {
                scratchCard.classList.add('shake');
                setTimeout(() => scratchCard.classList.remove('shake'), 400);

                blessingText.textContent = getRandomThanks();
                scratchLayer.classList.remove('hidden-layer');

                blessingText.style.transform = 'scale(0.95)';
                setTimeout(() => blessingText.style.transform = '', 100);
            }

            scratchLayer.addEventListener('click', function(e) {
                e.stopPropagation();
                scratchCardAction(e);
            });
            scratchLayer.addEventListener('touchstart', function(e) {
                e.preventDefault();
                e.stopPropagation();
                scratchCardAction(e);
            }, { passive: false });

            newScratchBtn.addEventListener('click', function() {
                resetScratchCard();
            });

            blessingText.textContent = getRandomThanks();
            scratchLayer.classList.remove('hidden-layer');
            scratchLayer.style.pointerEvents = 'auto';
            scratchLayer.style.cursor = 'pointer';
        })();
    </script>
</body>
</html>
