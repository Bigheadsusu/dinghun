<script>
(function () {
    // ---------- 背景音乐 ----------
    var audio = document.getElementById('bgm');
    var on = document.getElementById('musicOn');
    var off = document.getElementById('musicOff');
    var toggle = document.getElementById('musicToggle');
    var playing = false;

    function setState(state) {
        playing = state;
        on.style.display = playing ? 'block' : 'none';
        off.style.display = playing ? 'none' : 'block';
    }
    function playBgm() {
        if (!audio) return;
        var p = audio.play();
        if (p && p.then) { p.then(function () { setState(true); }); }
        else { setState(true); }
    }
    function pauseBgm() {
        if (!audio) return;
        audio.pause();
        setState(false);
    }
    toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        if (playing) { pauseBgm(); } else { playBgm(); }
    });
    // 尝试自动播放；被拦截时等待首次触摸/点击
    document.addEventListener('DOMContentLoaded', function () {
        if (!audio) return;
        var p = audio.play();
        if (p && p.catch) {
            p.catch(function () {
                var once = function () {
                    audio.play();
                    document.removeEventListener('touchstart', once);
                    document.removeEventListener('click', once);
                };
                document.addEventListener('touchstart', once, { passive: true });
                document.addEventListener('click', once, { once: true });
            });
        }
    });

    // ---------- 图片放大查看 ----------
    window.openViewer = function (item) {
        var img = item.querySelector('img.main');
        if (!img) return;
        document.getElementById('viewerImg').src = img.src;
        document.getElementById('viewer').classList.add('open');
    };
    window.closeViewer = function (e) {
        if (e.target.id === 'viewer' || e.target.className === 'close') {
            document.getElementById('viewer').classList.remove('open');
        }
    };
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { document.getElementById('viewer').classList.remove('open'); }
    });
})();
</script>
