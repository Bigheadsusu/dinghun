<style>
/* ================= 全局 · 朱底金饰 ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
:root {
    --red-deep: #8f0e19;
    --red: #c8102e;
    --gold: #f0c75e;
    --gold-soft: rgba(240, 199, 94, 0.55);
    --cream: #fff8e7;
    --cream-soft: rgba(255, 248, 231, 0.72);
}
body {
    font-family: "SimSun", "Songti SC", "宋体", serif;
    color: var(--cream);
    line-height: 1.8;
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(900px 480px at 85% -6%, rgba(240, 199, 94, 0.10), transparent 60%),
        radial-gradient(800px 460px at -10% 62%, rgba(240, 199, 94, 0.07), transparent 58%),
        linear-gradient(175deg, var(--red-deep) 0%, var(--red) 52%, #d0242e 100%);
}
body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(130% 95% at 50% 42%, transparent 58%, rgba(66, 4, 9, 0.34));
}
.kai { font-family: "KaiTi", "STKaiti", "楷体", "Microsoft JhengHei", serif; }
.wrap { max-width: 620px; margin: 0 auto; padding: 40px 32px 0; position: relative; z-index: 2; }

/* ================= 金边画框 ================= */
.frame { position: fixed; inset: 9px; z-index: 40; pointer-events: none; }
.frame::before {
    content: ""; position: absolute; inset: 0;
    border: 1px solid rgba(240, 199, 94, 0.8); border-radius: 4px;
}
.frame::after {
    content: ""; position: absolute; inset: 6px;
    border: 1px solid rgba(240, 199, 94, 0.4); border-radius: 2px;
}
.frame .c { position: absolute; width: 54px; height: 54px; color: var(--gold); }
.frame .c.tl { top: -1px; left: -1px; }
.frame .c.tr { top: -1px; right: -1px; transform: scaleX(-1); }
.frame .c.bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
.frame .c.br { bottom: -1px; right: -1px; transform: scale(-1, -1); }

/* ================= 飘花 ================= */
.petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
.petal { position: absolute; top: -6vh; opacity: 0; animation: fall linear infinite; }
.petal.pink { color: #f6c2cb; }
.petal.gold { color: var(--gold); }
@keyframes fall {
    0%   { transform: translate(0, -6vh) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.85; }
    50%  { transform: translate(4vw, 50vh) rotate(190deg); opacity: 0.7; }
    100% { transform: translate(-2vw, 108vh) rotate(380deg); opacity: 0.08; }
}
@media (prefers-reduced-motion: reduce) { .petal { display: none; } }

/* ================= 音乐按钮（SVG 图标） ================= */
.music-btn {
    position: fixed; top: 26px; right: 26px; z-index: 999;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(110, 7, 14, 0.78);
    border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--gold);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
}
.music-btn svg { width: 20px; height: 20px; display: block; }
.music-btn svg.spin { animation: spin 4s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* ================= 封面 · 纵横几何构图 ================= */
.hero { position: relative; padding: 26px 0 6px; }
.hero .branch {
    position: absolute; top: -12px; right: -18px;
    width: 168px; height: auto; color: var(--gold); opacity: 0.9;
    pointer-events: none;
}
.hero-grid { display: flex; gap: 30px; align-items: stretch; position: relative; }
.hero .side { display: flex; flex-direction: column; align-items: center; gap: 20px; flex-shrink: 0; }
/* 印章式竖排标题 · 左右歪扭错落 */
.hero .v-title {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    flex-shrink: 0;
}
.hero .v-title .ch {
    position: relative; width: 54px; height: 54px;
    background: var(--gold); color: #9c0f1c; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; line-height: 1;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}
.hero .v-title .ch::after {
    content: ""; position: absolute; inset: 3px;
    border: 1px solid rgba(156, 15, 28, 0.55); border-radius: 5px;
}
/* 奇偶交替：左倾右错 / 右倾左错，成歪扭之趣 */
.hero .v-title .ch:nth-child(odd)  { transform: rotate(-5deg) translateX(-5px); }
.hero .v-title .ch:nth-child(even) { transform: rotate(4deg)  translateX(5px); }
.hero .v-title .ch.big {
    width: 68px; height: 68px; font-size: 46px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.42), 0 0 24px rgba(255, 215, 106, 0.35);
}
/* 右侧主栏 · 左对齐 */
.hero .main { flex: 1; min-width: 0; text-align: left; padding-top: 4px; }
.hero .eyebrow {
    font-size: 12px; letter-spacing: 9px; color: var(--gold); opacity: 0.92;
}
.hero .names {
    display: flex; align-items: center; flex-wrap: wrap;
    font-size: clamp(27px, 7.8vw, 37px); color: var(--cream);
    letter-spacing: 4px; margin-top: 18px; line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.32);
}
.hero .names .heart {
    font-style: normal; font-size: 0.62em; line-height: 1;
    margin: 0 0.34em; vertical-align: middle;
    filter: drop-shadow(0 0 8px rgba(255, 96, 142, 0.75));
    animation: beat 1.7s ease-in-out infinite;
    transform-origin: center;
}
@keyframes beat {
    0%, 100% { transform: scale(1); }
    12%      { transform: scale(1.25); }
    24%      { transform: scale(1); }
    36%      { transform: scale(1.16); }
    48%      { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .hero .names .heart { animation: none; } }
.hero .poem {
    margin-top: 24px; padding: 3px 0 3px 16px;
    border-left: 2px solid var(--gold-soft);
    font-size: 15px; letter-spacing: 3px; color: var(--cream);
    line-height: 2.15;
}
.hero .invite {
    margin-top: 22px; font-size: 14px; letter-spacing: 4px; color: #ffe9b0;
}
.hero .date { margin-top: 24px; }
.hero .date .num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px; letter-spacing: 2px; color: var(--cream);
}
.hero .date .num em { font-style: normal; color: var(--gold); margin: 0 6px; }
.hero .date .lunar {
    display: block; font-size: 13px; letter-spacing: 6px;
    color: var(--cream-soft); margin-top: 8px;
}

/* ================= 分节 · 祥云 ================= */
.orna { display: flex; align-items: center; gap: 18px; margin: 64px 0 4px; }
.orna .l, .orna .r { flex: 1; height: 1px; }
.orna .l { background: linear-gradient(90deg, transparent, var(--gold-soft)); }
.orna .r { background: linear-gradient(90deg, var(--gold-soft), transparent); }
.orna .cloud { width: 46px; height: 24px; color: var(--gold); flex-shrink: 0; }

/* ================= 婚宴信息 · 疏密对比 ================= */
.info { position: relative; padding: 30px 4px 0; }
.info .watermark {
    position: absolute; top: 22px; right: -16px;
    font-size: 200px; line-height: 1; color: rgba(240, 199, 94, 0.06);
    pointer-events: none; user-select: none;
    font-family: "KaiTi", "STKaiti", "楷体", serif;
}
.block { display: flex; gap: 24px; align-items: flex-start; margin: 48px 0; position: relative; }
.block .v-label {
    writing-mode: vertical-rl; letter-spacing: 15px; text-indent: 3px;
    font-size: 13px; color: var(--gold);
    border: 1px solid var(--gold-soft); border-radius: 3px;
    padding: 13px 7px; background: rgba(240, 199, 94, 0.07);
    flex-shrink: 0;
}
.block .content { flex: 1; padding-top: 2px; text-align: left; }
.block h3 { font-size: 24px; font-weight: 600; letter-spacing: 3px; color: var(--cream); line-height: 1.6; }
.block .sub {
    font-size: 14px; color: var(--cream-soft);
    letter-spacing: 2px; line-height: 2.1; margin-top: 8px;
}
.nav {
    display: inline-block; margin-top: 16px;
    color: var(--gold); text-decoration: none;
    font-size: 13px; letter-spacing: 5px; text-indent: 5px;
    border-bottom: 1px solid var(--gold-soft); padding-bottom: 4px;
}
.nav:active { opacity: 0.7; }

/* ================= 尾景 · 金山祥云 ================= */
footer { margin-top: 72px; position: relative; text-align: right; }
footer .branch-b {
    position: absolute; left: -14px; bottom: 64px;
    width: 120px; height: auto; color: var(--gold); opacity: 0.4;
    transform: scaleX(-1); pointer-events: none;
}
footer .sun {
    width: 40px; height: 40px; border-radius: 50%; margin-left: auto; margin-right: 34px;
    background: radial-gradient(circle, rgba(240, 199, 94, 0.85), rgba(240, 199, 94, 0.4));
    filter: blur(0.4px);
}
footer .mountains { display: block; width: 100%; height: 104px; margin-top: -12px; }
footer .blessing {
    padding: 4px 6px 56px; font-size: 12.5px; color: var(--cream-soft);
    letter-spacing: 4px; line-height: 2.5; text-align: right;
}

/* ================= 移动端微调 ================= */
@media (max-width: 430px) {
    .wrap { padding: 30px 26px 0; }
    .frame { inset: 6px; }
    .frame .c { width: 40px; height: 40px; }
    .hero-grid { gap: 20px; }
    .hero .v-title { gap: 8px; }
    .hero .v-title .ch { width: 46px; height: 46px; font-size: 25px; border-radius: 7px; }
    .hero .v-title .ch.big { width: 58px; height: 58px; font-size: 38px; }
    .hero .date .num { font-size: 25px; }
    .hero .date .lunar { font-size: 12px; letter-spacing: 4px; }
    .hero .branch { width: 124px; right: -10px; top: -8px; opacity: 0.72; }
    .info .watermark { font-size: 150px; right: -18px; }
    .block { gap: 18px; margin: 40px 0; }
    footer .branch-b { width: 92px; bottom: 56px; }
}

/* 小屏手机（≤360px） */
@media (max-width: 360px) {
    .wrap { padding: 26px 20px 0; }
    .hero-grid { gap: 14px; }
    .hero .v-title { gap: 6px; }
    .hero .v-title .ch { width: 42px; height: 42px; font-size: 22px; }
    .hero .v-title .ch.big { width: 54px; height: 54px; font-size: 34px; }
    .hero .names { font-size: clamp(22px, 7vw, 27px); letter-spacing: 2px; }
    .hero .date .num { font-size: 22px; letter-spacing: 1px; }
    .hero .date .lunar { font-size: 11px; letter-spacing: 2px; margin-top: 6px; }
    .hero .eyebrow { letter-spacing: 6px; }
    .hero .poem { font-size: 13.5px; letter-spacing: 2px; }
    .hero .invite { font-size: 12.5px; letter-spacing: 2px; }
    .frame .c { width: 32px; height: 32px; }
}

/* 超小屏（≤320px，如 iPhone SE 1代） */
@media (max-width: 320px) {
    .wrap { padding: 22px 16px 0; }
    .hero-grid { gap: 12px; }
    .hero .v-title .ch { width: 38px; height: 38px; font-size: 20px; }
    .hero .v-title .ch.big { width: 48px; height: 48px; font-size: 30px; }
    .block h3 { font-size: 20px; }
}

/* 平板 / 桌面：印章稍大更醒目 */
@media (min-width: 600px) {
    .hero { padding-top: 34px; }
    .hero .v-title { gap: 12px; }
    .hero .v-title .ch { width: 58px; height: 58px; font-size: 32px; }
    .hero .v-title .ch.big { width: 74px; height: 74px; font-size: 50px; }
}
</style>

    </footer>
</div>

<script>
(function () {
    // ---------- 背景音乐 ----------
    var audio = document.getElementById('bgm');
    var icon = document.getElementById('musicIcon');
    var toggle = document.getElementById('musicToggle');
    var playing = false;

    function setState(state) {
        playing = state;
        if (icon) { icon.classList.toggle('spin', playing); }
        toggle.setAttribute('aria-pressed', playing ? 'true' : 'false');
    }
    function playBgm() {
        if (!audio) return;
        var p = audio.play();
        if (p && p.then) { p.then(function () { setState(true); }); }
        else { setState(true); }
    }
    function pauseBgm() {
        if (!audio) return;
        audio.pause();
        setState(false);
    }
    toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        if (playing) { pauseBgm(); } else { playBgm(); }
    });
    // 尝试自动播放；被拦截时等待首次触摸/点击
    document.addEventListener('DOMContentLoaded', function () {
        if (!audio) return;
        var p = audio.play();
        if (p && p.catch) {
            p.catch(function () {
                var once = function () {
                    audio.play();
                    document.removeEventListener('touchstart', once);
                    document.removeEventListener('click', once);
                };
                document.addEventListener('touchstart', once, { passive: true });
                document.addEventListener('click', once, { once: true });
            });
        }
    });
})();
</script>
</body>
