<script>
    scaleW = window.innerWidth / 320;
    scaleH = window.innerHeight / 480;
    let resize = document.querySelectorAll('.resize');
    for (let j = 0; j < resize.length; j++) {
        if (resize[j].style.width)  resize[j].style.width  = parseInt(resize[j].style.width)  * scaleW + 'px';
        if (resize[j].style.height) resize[j].style.height = parseInt(resize[j].style.height) * scaleH + 'px';
        if (resize[j].style.top)    resize[j].style.top    = parseInt(resize[j].style.top)    * scaleH + 'px';
        if (resize[j].style.left)   resize[j].style.left   = parseInt(resize[j].style.left)   * scaleW + 'px';
    }
    let mySwiper = new Swiper('.swiper-container', {
        direction: 'vertical',
        mousewheelControl: true,
        loop: false,
        speed: 1200,
        zoom: true,
        pagination: '.swiper-pagination',
        paginationType: 'progress',
        onInit: function (swiper) {
            swiperAnimateCache(swiper);
            swiperAnimate(swiper);
        },
        onSlideChangeEnd: function (swiper) {
            swiperAnimate(swiper);
        },
        onTransitionEnd: function (swiper) {
            swiperAnimate(swiper);
        },
        watchSlidesProgress: true,
        onProgress: function (swiper) {
            for (let i = 0; i < swiper.slides.length; i++) {
                let slide = swiper.slides[i];
                let progress = slide.progress;
                let translate = progress * swiper.height / 4;
                let scale = 1 - Math.min(Math.abs(progress * 0.5), 1);
                slide.style.opacity = 1 - Math.min(Math.abs(progress / 2), 0.5);
                let es = slide.style;
                es.webkitTransform = es.MsTransform = es.msTransform = es.MozTransform = es.OTransform = es.transform =
                    'translate3d(0,' + translate + 'px,-' + translate + 'px) scaleY(' + scale + ')';
            }
        },
        onSetTransition: function (swiper, speed) {
            for (let i = 0, es; i < swiper.slides.length; i++) {
                es = swiper.slides[i].style;
                es.webkitTransitionDuration = es.MsTransitionDuration = es.msTransitionDuration =
                    es.MozTransitionDuration = es.OTransitionDuration = es.transitionDuration = speed + 'ms';
            }
        },
    });

    function musicPlay() {
        document.getElementById('music_stop').style.display = 'none';
        document.getElementById('music_play').style.display = '';
        var a = document.getElementById('music_tag');
        a && a.play();
    }
    function musicStop() {
        document.getElementById('music_stop').style.display = '';
        document.getElementById('music_play').style.display = 'none';
        var a = document.getElementById('music_tag');
        a && a.pause();
    }

    // 尝试自动播放；被浏览器拦截时等待首次用户交互
    $(document).ready(function() {
        var audio = document.getElementById('music_tag');
        if (!audio) return;
        var p = audio.play();
        if (p && p.catch) {
            p.catch(function() {
                var once = function() {
                    audio.play();
                    document.removeEventListener('touchstart', once);
                    document.removeEventListener('click', once);
                };
                document.addEventListener('touchstart', once, { passive: true });
                document.addEventListener('click', once, { once: true });
            });
        }
    });
</script>
